name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-macos:
    name: Swift ${{ matrix.swift }} on macOS ${{ matrix.macos }} with Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.0"
            xcode: "16.0"
            macos: "15"
            runner: macos-15
          - swift: "6.1"
            xcode: "16.3"
            macos: "15"
            runner: macos-15
          - swift: "6.2"
            xcode: "26.0"
            macos: "26"
            runner: macos-26
          - swift: "6.3"
            xcode: "26.6"
            macos: "26"
            runner: macos-26
          - swift: "6.4"
            xcode: "27.0"
            macos: "27"
            runner: xcode-27
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  test-linux:
    name: Swift ${{ matrix.swift }} on Linux
    runs-on: ubuntu-latest
    container: "swift:${{ matrix.swift }}"
    strategy:
      fail-fast: false
      matrix:
        swift:
          - "6.0.3"
          - "6.1.3"
          - "6.2.4"
          - "6.3.3"
          - "6.4.0"
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build
        run: swift build

      - name: Test
        run: swift test
